name: Deploy CompraSmart IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified product images
        shell: bash
        run: |
          set -e
          mkdir -p dist/assets/products
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/71UAATIXJ3L._AC_SL1500_.jpg' -o dist/assets/products/smartia-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/610Q8Ni5YlL._AC_SL1500_.jpg' -o dist/assets/products/tapo-p110m-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/61qrw8pAVNL._SL1500_.jpg' -o dist/assets/products/renpho-elis1-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://resource.logitech.com/w_544%2Ch_466%2Car_7%3A6%2Cc_pad%2Cq_auto%2Cf_auto%2Cdpr_1.0/d_transparent.gif/content/dam/logitech/en/products/mice/pebble-mouse-2-m350s/2026-refresh/gallery/pebble-mouse-2-m350s-tonal-rose-top-angle-gallery-1.png' -o dist/assets/products/logitech-m350s.png
          test -s dist/assets/products/smartia-amazon.jpg
          test -s dist/assets/products/tapo-p110m-amazon.jpg
          test -s dist/assets/products/renpho-elis1-amazon.jpg
          test -s dist/assets/products/logitech-m350s.png

      - name: Build embedded product image fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json

          files = [
              ('smartia gafas inteligentes camara ia bluetooth', 'dist/assets/products/smartia-amazon.jpg', 'image/jpeg', 'SMARTIA Gafas Inteligentes con Cámara e IA'),
              ('tp link tapo p110m enchufe inteligente matter energia', 'dist/assets/products/tapo-p110m-amazon.jpg', 'image/jpeg', 'TP-Link Tapo P110M Enchufe Inteligente Matter'),
              ('renpho elis 1 bascula inteligente composicion corporal', 'dist/assets/products/renpho-elis1-amazon.jpg', 'image/jpeg', 'RENPHO Elis 1 Báscula Inteligente'),
              ('logitech pebble mouse 2 m350s raton bluetooth silencioso', 'dist/assets/products/logitech-m350s.png', 'image/png', 'Logitech Pebble Mouse 2 M350s'),
          ]

          rows = []
          for name, path, mime, alt in files:
              data = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              rows.append([name, f'data:{mime};base64,{data}', alt])

          js = """(() => {\n  const images = %s;\n  images.forEach(([name, src, alt]) => {\n    const card = document.querySelector(`.product-card[data-name=\"${name}\"]`);\n    const art = card?.querySelector('.product-art');\n    if (!art) return;\n    art.style.cssText = 'display:flex;align-items:center;justify-content:center;padding:18px;background:#fff;overflow:hidden;';\n    art.innerHTML = `<img src=\"${src}\" alt=\"${alt}\" loading=\"eager\" style=\"width:auto;height:auto;max-width:82%%;max-height:82%%;object-fit:contain;display:block;margin:auto\">`;\n    art.removeAttribute('aria-hidden');\n    art.setAttribute('role','img');\n    art.setAttribute('aria-label', alt);\n  });\n})();\n""" % json.dumps(rows, ensure_ascii=False)
          Path('dist/product-image-fix.js').write_text(js, encoding='utf-8')
          PY

      - name: Inject product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="maehihw-fix.js?v=3"></script>',
              '<script src="tapo-fix.js?v=3"></script>',
              '<script src="ugreen-fix.js?v=3"></script>',
              '<script src="renpho-fix.js?v=3"></script>',
              '<script src="logitech-fix.js?v=3"></script>',
              '<script src="samsung-fix.js?v=3"></script>',
              '<script src="product-image-fix.js?v=20260913-3"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', f'  {tag}\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
