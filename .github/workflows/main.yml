name: Deploy CompraSmart IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified product images
        shell: bash
        run: |
          set -e
          mkdir -p dist/assets/products
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" 'https://m.media-amazon.com/images/I/71UAATIXJ3L._AC_SL1500_.jpg' -o dist/assets/products/smartia-amazon.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://m.media-amazon.com/images/I/610Q8Ni5YlL._AC_SL1500_.jpg' -o dist/assets/products/tapo-p110m-amazon.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://m.media-amazon.com/images/I/61qrw8pAVNL._SL1500_.jpg' -o dist/assets/products/renpho-elis1-amazon.jpg
          curl -L --fail --retry 3 -A "$UA" 'https://expocolsuministros.com/wp-content/uploads/2024/06/mouse-logitech-m350s-pebble-2-bluetooth-grafito-001.jpg' -o dist/assets/products/logitech-m350s.jpg
          test -s dist/assets/products/smartia-amazon.jpg
          test -s dist/assets/products/tapo-p110m-amazon.jpg
          test -s dist/assets/products/renpho-elis1-amazon.jpg
          test -s dist/assets/products/logitech-m350s.jpg

      - name: Inject product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="maehihw-fix.js?v=3"></script>',
              '<script src="tapo-fix.js?v=3"></script>',
              '<script src="ugreen-fix.js?v=3"></script>',
              '<script src="renpho-fix.js?v=3"></script>',
              '<script src="logitech-fix.js?v=3"></script>',
              '<script src="samsung-fix.js?v=3"></script>',
              '<script src="product-image-fix.js?v=20260913-1"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', f'  {tag}\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
