name: Deploy CompraSmart IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified product images
        shell: bash
        run: |
          set -e
          mkdir -p dist/assets/products
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/71UAATIXJ3L._AC_SL1500_.jpg' -o dist/assets/products/smartia-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/610Q8Ni5YlL._AC_SL1500_.jpg' -o dist/assets/products/tapo-p110m-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://m.media-amazon.com/images/I/61qrw8pAVNL._SL1500_.jpg' -o dist/assets/products/renpho-elis1-amazon.jpg
          curl -L --fail --retry 3 --retry-all-errors -A "$UA" 'https://resource.logitech.com/w_544%2Ch_466%2Car_7%3A6%2Cc_pad%2Cq_auto%2Cf_auto%2Cdpr_1.0/d_transparent.gif/content/dam/logitech/en/products/mice/pebble-mouse-2-m350s/2026-refresh/gallery/pebble-mouse-2-m350s-tonal-rose-top-angle-gallery-1.png' -o dist/assets/products/logitech-m350s.png
          test -s dist/assets/products/smartia-amazon.jpg
          test -s dist/assets/products/tapo-p110m-amazon.jpg
          test -s dist/assets/products/renpho-elis1-amazon.jpg
          test -s dist/assets/products/logitech-m350s.png

      - name: Use local product images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('dist/app.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "applyProductImage('smartia gafas inteligentes camara ia bluetooth','https://m.media-amazon.com/images/I/71UAATIXJ3L._AC_SL1500_.jpg','SMARTIA Gafas Inteligentes con Cámara e IA','78%');":
              "applyProductImage('smartia gafas inteligentes camara ia bluetooth','assets/products/smartia-amazon.jpg?v=177','SMARTIA Gafas Inteligentes con Cámara e IA','78%');",
              "applyProductImage('tp link tapo p110m enchufe inteligente matter energia','https://m.media-amazon.com/images/I/610Q8Ni5YlL._AC_SL1500_.jpg','TP-Link Tapo P110M Enchufe Inteligente Matter','74%');":
              "applyProductImage('tp link tapo p110m enchufe inteligente matter energia','assets/products/tapo-p110m-amazon.jpg?v=177','TP-Link Tapo P110M Enchufe Inteligente Matter','74%');",
              "applyProductImage('renpho elis 1 bascula inteligente composicion corporal','https://m.media-amazon.com/images/I/61qrw8pAVNL._SL1500_.jpg','RENPHO Elis 1 Báscula Inteligente','76%');":
              "applyProductImage('renpho elis 1 bascula inteligente composicion corporal','assets/products/renpho-elis1-amazon.jpg?v=177','RENPHO Elis 1 Báscula Inteligente','76%');",
              "applyProductImage('logitech pebble mouse 2 m350s raton bluetooth silencioso','https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=900&q=85','Logitech Pebble Mouse 2 M350s','72%');":
              "applyProductImage('logitech pebble mouse 2 m350s raton bluetooth silencioso','assets/products/logitech-m350s.png?v=177','Logitech Pebble Mouse 2 M350s','72%');",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Missing expected product image mapping')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          h = Path('dist/index.html')
          html = h.read_text(encoding='utf-8')
          html = re.sub(r'<script src="app\.js\?v=[^"]+"></script>', '<script src="app.js?v=177"></script>', html)
          html = re.sub(r'\n\s*<script src="(?:maehihw|tapo|ugreen|renpho|logitech|samsung)-fix\.js\?v=[^"]+"></script>', '', html)
          html = re.sub(r'\n\s*<script src="product-image-fix\.js\?v=[^"]+"></script>', '', html)
          h.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
