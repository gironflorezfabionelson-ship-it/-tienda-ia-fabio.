name: Deploy CompraSmart IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="maehihw-fix.js?v=2"></script>',
              '<script src="tapo-fix.js?v=1"></script>',
              '<script src="ugreen-fix.js?v=1"></script>',
              '<script src="renpho-fix.js?v=1"></script>',
              '<script src="logitech-fix.js?v=1"></script>',
              '<script src="samsung-fix.js?v=1"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', f'  {tag}\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
